# Comprobaciones en cada push y pull request: si algo falla, GitHub lo marca en rojo.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      # Avisa si alguna dependencia tiene una vulnerabilidad conocida.
      - run: pip install pip-audit==2.9.0 && pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run build # incluye la comprobación de tipos
      # Solo falla con avisos altos o críticos de lo que llega al usuario.
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    # La app real en un navegador (Playwright) con una BD temporal: lo mismo que scripts/e2e.sh en local.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/e2e.sh
      # Si algo falla, las capturas se descargan desde la pestaña "Summary" de la ejecución.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capturas-e2e
          path: e2e/capturas/
          retention-days: 7
