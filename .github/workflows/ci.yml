# Comprobaciones en cada push y pull request: si algo falla, GitHub lo marca en rojo.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      # Avisa si alguna dependencia tiene una vulnerabilidad conocida.
      - run: pip install pip-audit && pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run build # incluye la comprobación de tipos
      # Solo falla con avisos altos o críticos de lo que llega al usuario.
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    # La app real en un navegador (Playwright) con una BD temporal: lo mismo que scripts/e2e.sh en local.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: scripts/e2e.sh
      # Si algo falla, las capturas se descargan desde la pestaña "Summary" de la ejecución.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-e2e
          path: e2e/capturas/
          retention-days: 7
