services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /data
    volumes:
      # La BD vive en ./data del host: sobrevive a `docker compose down`.
      - ./data:/data
      # Desarrollo: montamos el código para que --reload aplique los cambios al guardar.
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # Dentro de la red de Docker, el backend se llama por el nombre del servicio.
      API_URL: http://backend:8000
      VITE_USAR_POLLING: "true"
    volumes:
      - ./frontend:/app
      # Volumen anónimo: conserva el node_modules del contenedor (Linux) y evita
      # que lo tape la carpeta montada del host.
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
